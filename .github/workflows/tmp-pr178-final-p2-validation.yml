name: Temporary PR178 final P2 validation

on:
  push:
    branches:
      - feature/official-release-source-control-api

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Validate
        run: |
          python -m py_compile tests/test_official_release_source_approval_audit_sql.py
          git diff --check
          python -m unittest discover -s tests -p 'test_official_release_source*.py' -v
          python -m unittest discover -s tests -v

name: Deploy MarketAI to seesam-hub

on:
  workflow_dispatch:
    inputs:
      ota_channel:
        description: Expo OTA channel for a manual run
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
  push:
    branches:
      - feature/trading-system-foundation

permissions:
  contents: read

concurrency:
  group: marketai-seesam-hub-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    name: Test, deploy and update app
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Compile Python
        run: |
          /home/marko/marketai-repo/.venv/bin/python -m py_compile trading_system/*.py trading_system/brokers/*.py tests/*.py

      - name: Run Python tests
        run: |
          /home/marko/marketai-repo/.venv/bin/python -m unittest discover -s tests -v

      - name: Validate mobile app
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint

      - name: Install backend dependencies
        run: |
          /home/marko/marketai-repo/.venv/bin/pip install -r requirements.txt

      - name: Fast-forward production checkout to tested commit
        id: fast_forward
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          cd /home/marko/marketai-repo
          test "$(git branch --show-current)" = "feature/trading-system-foundation"
          test -z "$(git status --porcelain --untracked-files=no)"
          PREVIOUS_SHA="$(git rev-parse HEAD 2>/dev/null || true)"
          echo "previous_sha=${PREVIOUS_SHA}" >> "$GITHUB_OUTPUT"
          git fetch origin feature/trading-system-foundation
          git merge --ff-only "$DEPLOY_SHA"

      - name: Restart MarketAI services
        run: |
          sudo /usr/bin/systemctl restart marketai-api.service
          sudo /usr/bin/systemctl restart marketai-hays-release.service

      - name: Verify services
        run: |
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8001/health >/tmp/marketai-health.json; then
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "MarketAI API health check failed"
              sudo /usr/bin/systemctl status marketai-api.service --no-pager -l || true
              exit 1
            fi
            sleep 1
          done
          cat /tmp/marketai-health.json
          /usr/bin/systemctl is-active --quiet marketai-hays-release.service

      # Fail-safe guard: an OTA update can only contain JS-bundle-level changes.
      # If anything that affects the native build (dependencies, app config,
      # EAS config, native/plugin sources) changed since the previously
      # deployed commit, publishing an OTA would ship a bundle that the
      # currently installed native binary cannot run. In that case we must
      # skip OTA and require a fresh EAS build / version bump instead.
      - name: Detect native-affecting mobile changes
        id: native_guard
        env:
          DEPLOY_SHA: ${{ github.sha }}
          PREVIOUS_SHA: ${{ steps.fast_forward.outputs.previous_sha }}
        run: |
          cd /home/marko/marketai-repo || exit 1

          # Anything under mobile/ that influences the compiled native app
          # rather than just the JS bundle: dependency manifests/lockfiles,
          # Expo/EAS config, native project folders and config plugins.
          NATIVE_PATTERNS='^mobile/package\.json$|^mobile/package-lock\.json$|^mobile/yarn\.lock$|^mobile/pnpm-lock\.yaml$|^mobile/app\.json$|^mobile/app\.config\.(js|ts|json)$|^mobile/eas\.json$|^mobile/ios/|^mobile/android/|^mobile/plugins/|\.podspec$'

          DELIM="GITHUB_OUTPUT_EOF_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"

          if [ -z "$PREVIOUS_SHA" ]; then
            echo "native_change=true" >> "$GITHUB_OUTPUT"
            {
              echo "reason<<$DELIM"
              echo "No previous deployed commit could be determined (first deploy on this host). Treating this as a native change and skipping OTA to be safe."
              echo "$DELIM"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$PREVIOUS_SHA" = "$DEPLOY_SHA" ]; then
            echo "native_change=false" >> "$GITHUB_OUTPUT"
            {
              echo "reason<<$DELIM"
              echo "No new commits since the previously deployed commit (${PREVIOUS_SHA})."
              echo "$DELIM"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null; then
            echo "native_change=true" >> "$GITHUB_OUTPUT"
            {
              echo "reason<<$DELIM"
              echo "Previously deployed commit ${PREVIOUS_SHA} is not present in this checkout's history, so the diff cannot be verified. Treating this as a native change and skipping OTA to be safe."
              echo "$DELIM"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES="$(git diff --name-only "${PREVIOUS_SHA}" "${DEPLOY_SHA}")"
          NATIVE_FILES="$(printf '%s\n' "$CHANGED_FILES" | grep -E "$NATIVE_PATTERNS" || true)"

          if [ -n "$NATIVE_FILES" ]; then
            echo "native_change=true" >> "$GITHUB_OUTPUT"
            {
              echo "reason<<$DELIM"
              echo "Native-affecting mobile files changed between ${PREVIOUS_SHA:0:7} and ${DEPLOY_SHA:0:7}:"
              echo "$NATIVE_FILES"
              echo "A new EAS build (and, if app.json/eas.json version fields changed, a version bump) is required before these changes can reach devices. Run an EAS build for the affected platform(s) first."
              echo "$DELIM"
            } >> "$GITHUB_OUTPUT"
          else
            echo "native_change=false" >> "$GITHUB_OUTPUT"
            {
              echo "reason<<$DELIM"
              echo "No native-affecting mobile files changed between ${PREVIOUS_SHA:0:7} and ${DEPLOY_SHA:0:7}. Safe to publish an OTA update."
              echo "$DELIM"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Report native-change guard result
        if: always() && steps.native_guard.outcome == 'success'
        env:
          NATIVE_CHANGE: ${{ steps.native_guard.outputs.native_change }}
          REASON: ${{ steps.native_guard.outputs.reason }}
        run: |
          {
            echo "### OTA native-change guard"
            echo
            echo "native_change=${NATIVE_CHANGE}"
            echo
            echo '```'
            echo "$REASON"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish preview OTA update
        if: github.event_name == 'push' && steps.native_guard.outputs.native_change != 'true'
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "Missing GitHub secret EXPO_TOKEN"; exit 1; }
          npx --yes eas-cli update \
            --channel preview \
            --environment preview \
            --message "GitHub ${GITHUB_SHA}" \
            --non-interactive

      - name: Skip preview OTA update (native change detected)
        if: github.event_name == 'push' && steps.native_guard.outputs.native_change == 'true'
        env:
          REASON: ${{ steps.native_guard.outputs.reason }}
        run: |
          echo "::warning::Skipping preview OTA publish - native-affecting mobile files changed since the previous deploy. Build and restart still completed normally."
          echo "$REASON"

      - name: Publish manually selected OTA update
        if: github.event_name == 'workflow_dispatch' && steps.native_guard.outputs.native_change != 'true'
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          OTA_CHANNEL: ${{ inputs.ota_channel }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "Missing GitHub secret EXPO_TOKEN"; exit 1; }
          npx --yes eas-cli update \
            --channel "$OTA_CHANNEL" \
            --environment "$OTA_CHANNEL" \
            --message "Manual GitHub ${GITHUB_SHA}" \
            --non-interactive

      - name: Refuse manual OTA update (native change detected)
        if: github.event_name == 'workflow_dispatch' && steps.native_guard.outputs.native_change == 'true'
        env:
          REASON: ${{ steps.native_guard.outputs.reason }}
        run: |
          echo "::error::Refusing to publish a manual OTA update - native-affecting mobile files changed since the previous deploy. A new EAS build / version bump is required first; this guard cannot be bypassed by a manual run."
          echo "$REASON"
          exit 1

name: Deploy MarketAI to seesam-hub

on:
  workflow_dispatch:
    inputs:
      ota_channel:
        description: Expo OTA channel for a manual run
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
  push:
    branches:
      - feature/trading-system-foundation

permissions:
  contents: read

concurrency:
  group: marketai-seesam-hub-deploy
  cancel-in-progress: false

jobs:
  # Push path: test and deploy the backend to seesam-hub. Never touches
  # Expo/EAS - OTA is only ever published by the separate publish-ota job.
  deploy:
    name: Test and deploy backend
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Compile Python
        run: |
          /home/marko/marketai-repo/.venv/bin/python -m py_compile trading_system/*.py trading_system/brokers/*.py tests/*.py

      - name: Run Python tests
        run: |
          /home/marko/marketai-repo/.venv/bin/python -m unittest discover -s tests -v

      - name: Validate mobile app
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint

      - name: Install backend dependencies
        run: |
          /home/marko/marketai-repo/.venv/bin/pip install -r requirements.txt

      - name: Fast-forward production checkout to tested commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          cd /home/marko/marketai-repo || exit 1
          test "$(git branch --show-current)" = "feature/trading-system-foundation"
          test -z "$(git status --porcelain --untracked-files=no)"
          git fetch origin feature/trading-system-foundation
          git merge --ff-only "$DEPLOY_SHA"

      - name: Restart MarketAI services
        run: |
          sudo /usr/bin/systemctl restart marketai-api.service
          sudo /usr/bin/systemctl restart marketai-hays-release.service

      - name: Verify services
        run: |
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8001/health >/tmp/marketai-health.json; then
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "MarketAI API health check failed"
              sudo /usr/bin/systemctl status marketai-api.service --no-pager -l || true
              exit 1
            fi
            sleep 1
          done
          cat /tmp/marketai-health.json
          /usr/bin/systemctl is-active --quiet marketai-hays-release.service

  # Manual path: publish an Expo OTA update. Completely independent of the
  # deploy job - no backend deploy, no seesam-hub git checkout/fast-forward.
  # actions/checkout below always checks out github.sha, i.e. exactly the
  # commit/ref this run was dispatched from, so the OTA always ships what
  # the operator actually selected - it never tries to align with whatever
  # is currently checked out on the seesam-hub host.
  #
  # Whether an OTA update is safe to publish for that commit is a human
  # judgment call: see docs/ota-native-changes.md for the rule (JS/TS-only
  # -> OTA is fine; any native-affecting change -> bump the app/runtime
  # version and ship a new EAS build first, do not use OTA).
  publish-ota:
    name: Publish manual Expo OTA update
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    steps:
      - name: Restrict manual OTA to the deployment branch
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          if [ "$RUN_REF" != "refs/heads/feature/trading-system-foundation" ]; then
            echo "::error::Manual OTA runs are only allowed from refs/heads/feature/trading-system-foundation, not '${RUN_REF}'. Re-run this workflow with that branch selected."
            exit 1
          fi

      - name: Checkout dispatched commit
        uses: actions/checkout@v4

      - name: Validate mobile app
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint

      - name: Publish OTA update
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          OTA_CHANNEL: ${{ inputs.ota_channel }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "Missing GitHub secret EXPO_TOKEN"; exit 1; }
          npx --yes eas-cli update \
            --channel "$OTA_CHANNEL" \
            --environment "$OTA_CHANNEL" \
            --message "Manual GitHub ${GITHUB_SHA}" \
            --non-interactive

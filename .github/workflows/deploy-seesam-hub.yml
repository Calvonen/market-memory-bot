name: Deploy MarketAI to seesam-hub

on:
  workflow_dispatch:
    inputs:
      ota_channel:
        description: Expo OTA channel for a manual run
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
  push:
    branches:
      - feature/trading-system-foundation

permissions:
  contents: read

jobs:
  deploy:
    name: Test and deploy backend
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    concurrency:
      group: marketai-backend-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Compile Python
        run: |
          /home/marko/marketai-repo/.venv/bin/python -m py_compile trading_system/*.py trading_system/brokers/*.py scripts/*.py tests/*.py

      - name: Run Python tests
        run: |
          /home/marko/marketai-repo/.venv/bin/python -m unittest discover -s tests -v

      - name: Validate mobile app
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint

      - name: Deploy backend to seesam-hub (locked)
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          LOCK_FILE="/tmp/marketai-deploy-ota.lock"
          LOCK_TIMEOUT_SECONDS=300

          exec 200>"$LOCK_FILE"
          if ! flock -w "$LOCK_TIMEOUT_SECONDS" 200; then
            echo "::error::Could not acquire the seesam-hub deploy/OTA lock (${LOCK_FILE}) within ${LOCK_TIMEOUT_SECONDS}s. Another deploy or OTA publish is holding it too long."
            exit 1
          fi

          /home/marko/marketai-repo/.venv/bin/pip install -r requirements.txt

          cd /home/marko/marketai-repo || exit 1
          test "$(git branch --show-current)" = "feature/trading-system-foundation"
          test -z "$(git status --porcelain --untracked-files=no)"
          git fetch origin feature/trading-system-foundation
          git merge --ff-only "$DEPLOY_SHA"

          set -a
          # shellcheck disable=SC1091
          source /home/marko/marketai/.env
          set +a
          /home/marko/marketai-repo/.venv/bin/python scripts/verify_supabase_schema.py

          # Calendar/watchlist candidate sync (Finnhub) is a scheduled
          # one-shot job, not a long-running worker - see
          # docs/calendar_watchlist.md. Installed/updated on every deploy so
          # a unit file change in this repo actually takes effect, and
          # `enable --now` is idempotent (safe to run on a deploy where
          # nothing about the timer changed). Placed after the schema gate,
          # like the two systemctl restarts below, so a missing calendar
          # migration stops this too, not just the API/release-worker
          # restarts.
          sudo /usr/bin/install -m 0644 deploy/systemd/marketai-calendar-sync.service /etc/systemd/system/marketai-calendar-sync.service
          sudo /usr/bin/install -m 0644 deploy/systemd/marketai-calendar-sync.timer /etc/systemd/system/marketai-calendar-sync.timer
          sudo /usr/bin/systemctl daemon-reload
          sudo /usr/bin/systemctl enable --now marketai-calendar-sync.timer

          sudo /usr/bin/systemctl restart marketai-api.service
          sudo /usr/bin/systemctl restart marketai-hays-release.service

          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8001/health >/tmp/marketai-health.json; then
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "MarketAI API health check failed"
              sudo /usr/bin/systemctl status marketai-api.service --no-pager -l || true
              exit 1
            fi
            sleep 1
          done
          cat /tmp/marketai-health.json

          # The Hays worker intentionally exits 0 once the event has reached a
          # terminal paper state. In that case systemd reports the unit as
          # inactive and `is-active --quiet` returns exit code 3 even though
          # the worker completed successfully. Accept either a still-active
          # monitor or a clean terminal exit; fail closed for actual unit
          # failures/crashes and print diagnostics.
          if ! /usr/bin/systemctl is-active --quiet marketai-hays-release.service; then
            HAYS_RESULT="$(/usr/bin/systemctl show marketai-hays-release.service --property=Result --value)"
            if [ "$HAYS_RESULT" != "success" ]; then
              echo "::error::marketai-hays-release.service is not active and last result is '${HAYS_RESULT:-<empty>}'"
              sudo /usr/bin/systemctl status marketai-hays-release.service --no-pager -l || true
              exit 1
            fi
            echo "marketai-hays-release.service exited cleanly after terminal event state; continuing deploy"
          fi

          STATE_DIR="/home/marko/marketai-deploy-state"
          mkdir -p "$STATE_DIR"
          printf '%s\n' "$DEPLOY_SHA" > "$STATE_DIR/last-deployed-backend.sha"

  publish-ota:
    name: Publish manual Expo OTA update
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    concurrency:
      group: marketai-ota-${{ inputs.ota_channel }}
      cancel-in-progress: false

    steps:
      - name: Restrict manual OTA to the deployment branch
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          if [ "$RUN_REF" != "refs/heads/feature/trading-system-foundation" ]; then
            echo "::error::Manual OTA runs are only allowed from refs/heads/feature/trading-system-foundation, not '${RUN_REF}'. Re-run this workflow with that branch selected."
            exit 1
          fi

      - name: Verify commit was already deployed to the backend (early check)
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          STATE_FILE="/home/marko/marketai-deploy-state/last-deployed-backend.sha"

          if [ ! -f "$STATE_FILE" ]; then
            echo "::error::No backend deploy has recorded a successful health check yet (${STATE_FILE} is missing). Refusing to publish OTA for ${DEPLOY_SHA}."
            exit 1
          fi

          DEPLOYED_SHA="$(tr -d '[:space:]' < "$STATE_FILE")"

          if [ "$DEPLOYED_SHA" != "$DEPLOY_SHA" ]; then
            echo "::error::Refusing to publish OTA for ${DEPLOY_SHA} - it does not match the last successfully deployed backend commit (${DEPLOYED_SHA:-<empty>}). Push this exact commit to feature/trading-system-foundation and wait for its backend deploy + health check to succeed before running this workflow again."
            exit 1
          fi

          echo "Commit ${DEPLOY_SHA} matches the last successfully deployed backend SHA - proceeding to mobile validation."

      - name: Checkout dispatched commit
        uses: actions/checkout@v4

      - name: Validate mobile app
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint

      - name: Verify deployed SHA and publish OTA update (locked)
        working-directory: mobile
        env:
          DEPLOY_SHA: ${{ github.sha }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          OTA_CHANNEL: ${{ inputs.ota_channel }}
        run: |
          LOCK_FILE="/tmp/marketai-deploy-ota.lock"
          LOCK_TIMEOUT_SECONDS=300

          exec 200>"$LOCK_FILE"
          if ! flock -w "$LOCK_TIMEOUT_SECONDS" 200; then
            echo "::error::Could not acquire the seesam-hub deploy/OTA lock (${LOCK_FILE}) within ${LOCK_TIMEOUT_SECONDS}s. A backend deploy or another OTA publish is holding it too long."
            exit 1
          fi

          STATE_FILE="/home/marko/marketai-deploy-state/last-deployed-backend.sha"

          if [ ! -f "$STATE_FILE" ]; then
            echo "::error::No backend deploy has recorded a successful health check yet (${STATE_FILE} is missing). Refusing to publish OTA for ${DEPLOY_SHA}."
            exit 1
          fi

          DEPLOYED_SHA="$(tr -d '[:space:]' < "$STATE_FILE")"

          if [ "$DEPLOYED_SHA" != "$DEPLOY_SHA" ]; then
            echo "::error::Refusing to publish OTA for ${DEPLOY_SHA} - it no longer matches the last successfully deployed backend commit (${DEPLOYED_SHA:-<empty>}). The backend was deployed to a different commit while this run was in progress. Re-run this workflow once the backend has redeployed to ${DEPLOY_SHA}, if that's still the intended commit."
            exit 1
          fi

          echo "Commit ${DEPLOY_SHA} still matches the last successfully deployed backend SHA under lock - publishing OTA."

          test -n "$EXPO_TOKEN" || { echo "Missing GitHub secret EXPO_TOKEN"; exit 1; }
          npx --yes eas-cli update \
            --channel "$OTA_CHANNEL" \
            --environment "$OTA_CHANNEL" \
            --message "Manual GitHub ${GITHUB_SHA}" \
            --non-interactive

name: Deploy MarketAI to seesam-hub

on:
  workflow_dispatch:
    inputs:
      ota_channel:
        description: Expo OTA channel for a manual run
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
  push:
    branches:
      - feature/trading-system-foundation

permissions:
  contents: read

concurrency:
  group: marketai-seesam-hub-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    name: Test, deploy and update app
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          # Full history is required so the native-compatibility guard below
          # can diff against an arbitrarily old per-channel baseline commit.
          fetch-depth: 0

      # Fail-safe guard: an OTA update can only contain JS-bundle-level
      # changes. Compatibility is tracked per Expo channel (preview /
      # production) against the last commit that channel actually shipped
      # a native EAS build for - never against the backend host's previous
      # deploy commit, which says nothing about what was last *built*.
      #
      # The baseline lives in the repo itself, at
      # .github/ota-baselines/<channel>.sha, so it only advances when a
      # human explicitly records a new build (see docs/ota-native-baseline.md).
      # Because every run diffs from that same fixed baseline (not from the
      # previous run), a native-affecting change keeps the channel "blocked"
      # across any number of later JS-only commits, automatically, with no
      # extra state to track - the block only clears once the baseline file
      # itself is updated to a newer, actually-built commit.
      - name: Determine OTA channel and check native-compatibility baseline
        id: native_guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          OTA_CHANNEL_INPUT: ${{ inputs.ota_channel }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -u

          if [ "$EVENT_NAME" = "push" ]; then
            CHANNEL="preview"
          else
            CHANNEL="$OTA_CHANNEL_INPUT"
          fi
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"

          BASELINE_FILE=".github/ota-baselines/${CHANNEL}.sha"
          DELIM="GITHUB_OUTPUT_EOF_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"

          fail_safe() {
            echo "native_change=true" >> "$GITHUB_OUTPUT"
            {
              echo "reason<<$DELIM"
              echo "$1"
              echo "$DELIM"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ ! -f "$BASELINE_FILE" ]; then
            fail_safe "No native-compatibility baseline recorded for channel '${CHANNEL}' (${BASELINE_FILE} is missing). Skipping OTA - see docs/ota-native-baseline.md to record one after the next EAS build."
          fi

          BASELINE_SHA="$(tr -d '[:space:]' < "$BASELINE_FILE")"

          if ! printf '%s' "$BASELINE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            fail_safe "Baseline file ${BASELINE_FILE} for channel '${CHANNEL}' does not contain a valid full 40-char commit SHA ('${BASELINE_SHA}'). Skipping OTA rather than guessing - see docs/ota-native-baseline.md."
          fi

          if ! git cat-file -e "${BASELINE_SHA}^{commit}" 2>/dev/null; then
            fail_safe "Baseline commit ${BASELINE_SHA} recorded for channel '${CHANNEL}' is not present in this checkout's history. Skipping OTA rather than guessing - see docs/ota-native-baseline.md."
          fi

          # Anything under mobile/ that influences the compiled native app
          # rather than just the JS bundle: dependency manifests/lockfiles,
          # Expo/EAS config, native project folders and config plugins.
          NATIVE_PATTERNS='^mobile/package\.json$|^mobile/package-lock\.json$|^mobile/yarn\.lock$|^mobile/pnpm-lock\.yaml$|^mobile/app\.json$|^mobile/app\.config\.(js|ts|json)$|^mobile/eas\.json$|^mobile/ios/|^mobile/android/|^mobile/plugins/|\.podspec$'

          if [ "$BASELINE_SHA" = "$DEPLOY_SHA" ]; then
            echo "native_change=false" >> "$GITHUB_OUTPUT"
            {
              echo "reason<<$DELIM"
              echo "Current commit is the recorded native-compatible baseline for '${CHANNEL}' (${BASELINE_SHA}). Safe to publish an OTA update."
              echo "$DELIM"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES="$(git diff --name-only "${BASELINE_SHA}" "${DEPLOY_SHA}")"
          NATIVE_FILES="$(printf '%s\n' "$CHANGED_FILES" | grep -E "$NATIVE_PATTERNS" || true)"

          if [ -n "$NATIVE_FILES" ]; then
            echo "native_change=true" >> "$GITHUB_OUTPUT"
            {
              echo "reason<<$DELIM"
              echo "Native-affecting mobile files changed for channel '${CHANNEL}' since its last known-compatible build baseline (${BASELINE_SHA:0:7}..${DEPLOY_SHA:0:7}):"
              echo "$NATIVE_FILES"
              echo "OTA for '${CHANNEL}' stays blocked - including for any later JS-only commits - until a new EAS build is published for '${CHANNEL}' and ${BASELINE_FILE} is updated to that build's commit. See docs/ota-native-baseline.md."
              echo "$DELIM"
            } >> "$GITHUB_OUTPUT"
          else
            echo "native_change=false" >> "$GITHUB_OUTPUT"
            {
              echo "reason<<$DELIM"
              echo "No native-affecting mobile files changed for channel '${CHANNEL}' since its baseline (${BASELINE_SHA:0:7}..${DEPLOY_SHA:0:7}). Safe to publish an OTA update."
              echo "$DELIM"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Report native-change guard result
        if: always() && steps.native_guard.outcome == 'success'
        env:
          CHANNEL: ${{ steps.native_guard.outputs.channel }}
          NATIVE_CHANGE: ${{ steps.native_guard.outputs.native_change }}
          REASON: ${{ steps.native_guard.outputs.reason }}
        run: |
          {
            echo "### OTA native-compatibility guard"
            echo
            echo "channel=${CHANNEL}"
            echo "native_change=${NATIVE_CHANGE}"
            echo
            echo '```'
            echo "$REASON"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compile Python
        run: |
          /home/marko/marketai-repo/.venv/bin/python -m py_compile trading_system/*.py trading_system/brokers/*.py tests/*.py

      - name: Run Python tests
        run: |
          /home/marko/marketai-repo/.venv/bin/python -m unittest discover -s tests -v

      - name: Validate mobile app
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint

      - name: Install backend dependencies
        run: |
          /home/marko/marketai-repo/.venv/bin/pip install -r requirements.txt

      - name: Fast-forward production checkout to tested commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          cd /home/marko/marketai-repo || exit 1
          test "$(git branch --show-current)" = "feature/trading-system-foundation"
          test -z "$(git status --porcelain --untracked-files=no)"
          git fetch origin feature/trading-system-foundation
          git merge --ff-only "$DEPLOY_SHA"

      - name: Restart MarketAI services
        run: |
          sudo /usr/bin/systemctl restart marketai-api.service
          sudo /usr/bin/systemctl restart marketai-hays-release.service

      - name: Verify services
        run: |
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8001/health >/tmp/marketai-health.json; then
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "MarketAI API health check failed"
              sudo /usr/bin/systemctl status marketai-api.service --no-pager -l || true
              exit 1
            fi
            sleep 1
          done
          cat /tmp/marketai-health.json
          /usr/bin/systemctl is-active --quiet marketai-hays-release.service

      - name: Publish preview OTA update
        if: github.event_name == 'push' && steps.native_guard.outputs.native_change != 'true'
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "Missing GitHub secret EXPO_TOKEN"; exit 1; }
          npx --yes eas-cli update \
            --channel preview \
            --environment preview \
            --message "GitHub ${GITHUB_SHA}" \
            --non-interactive

      - name: Skip preview OTA update (native change detected)
        if: github.event_name == 'push' && steps.native_guard.outputs.native_change == 'true'
        env:
          REASON: ${{ steps.native_guard.outputs.reason }}
        run: |
          echo "::warning::Skipping preview OTA publish - commit is not native-compatible with the recorded preview baseline. Build and restart still completed normally."
          echo "$REASON"

      - name: Publish manually selected OTA update
        if: github.event_name == 'workflow_dispatch' && steps.native_guard.outputs.native_change != 'true'
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          OTA_CHANNEL: ${{ inputs.ota_channel }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "Missing GitHub secret EXPO_TOKEN"; exit 1; }
          npx --yes eas-cli update \
            --channel "$OTA_CHANNEL" \
            --environment "$OTA_CHANNEL" \
            --message "Manual GitHub ${GITHUB_SHA}" \
            --non-interactive

      - name: Refuse manual OTA update (native change detected)
        if: github.event_name == 'workflow_dispatch' && steps.native_guard.outputs.native_change == 'true'
        env:
          CHANNEL: ${{ steps.native_guard.outputs.channel }}
          REASON: ${{ steps.native_guard.outputs.reason }}
        run: |
          echo "::error::Refusing to publish a manual OTA update to '${CHANNEL}' - commit is not native-compatible with the recorded baseline for that channel. A new EAS build for '${CHANNEL}' is required first; this guard cannot be bypassed by a manual run."
          echo "$REASON"
          exit 1

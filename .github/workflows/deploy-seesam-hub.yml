name: Deploy MarketAI to seesam-hub

on:
  workflow_dispatch:
    inputs:
      ota_channel:
        description: Expo OTA channel for a manual run
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
  push:
    branches:
      - feature/trading-system-foundation

permissions:
  contents: read

jobs:
  # Push path: test and deploy the backend to seesam-hub. Never touches
  # Expo/EAS - OTA is only ever published by the separate publish-ota job.
  #
  # Concurrency is scoped to this job only, in its own group, so a manual
  # OTA dispatch (see publish-ota below) can never queue behind, cancel, or
  # otherwise interact with a pending/running backend deploy. Backend
  # deploys still serialize among themselves.
  deploy:
    name: Test and deploy backend
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    concurrency:
      group: marketai-backend-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Compile Python
        run: |
          /home/marko/marketai-repo/.venv/bin/python -m py_compile trading_system/*.py trading_system/brokers/*.py tests/*.py

      - name: Run Python tests
        run: |
          /home/marko/marketai-repo/.venv/bin/python -m unittest discover -s tests -v

      - name: Validate mobile app
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint

      - name: Install backend dependencies
        run: |
          /home/marko/marketai-repo/.venv/bin/pip install -r requirements.txt

      - name: Fast-forward production checkout to tested commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          cd /home/marko/marketai-repo || exit 1
          test "$(git branch --show-current)" = "feature/trading-system-foundation"
          test -z "$(git status --porcelain --untracked-files=no)"
          git fetch origin feature/trading-system-foundation
          git merge --ff-only "$DEPLOY_SHA"

      - name: Restart MarketAI services
        run: |
          sudo /usr/bin/systemctl restart marketai-api.service
          sudo /usr/bin/systemctl restart marketai-hays-release.service

      - name: Verify services
        run: |
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8001/health >/tmp/marketai-health.json; then
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "MarketAI API health check failed"
              sudo /usr/bin/systemctl status marketai-api.service --no-pager -l || true
              exit 1
            fi
            sleep 1
          done
          cat /tmp/marketai-health.json
          /usr/bin/systemctl is-active --quiet marketai-hays-release.service

      # Source of truth for "was this commit actually deployed to the
      # backend": a plain file on the seesam-hub host, written only once
      # the health check above has passed. Deliberately not the git repo
      # (a commit here would itself be a push to feature/trading-system-foundation
      # and re-trigger this workflow) and not a GitHub Actions artifact
      # (adds a download/API round trip for no benefit when both jobs
      # already run on the same host). publish-ota reads this file and
      # refuses to publish unless its SHA matches exactly.
      - name: Record last successfully deployed backend SHA
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          STATE_DIR="/home/marko/marketai-deploy-state"
          mkdir -p "$STATE_DIR"
          printf '%s\n' "$DEPLOY_SHA" > "$STATE_DIR/last-deployed-backend.sha"

  # Manual path: publish an Expo OTA update. Completely independent of the
  # deploy job - no backend deploy, no seesam-hub git checkout/fast-forward.
  # actions/checkout below always checks out github.sha, i.e. exactly the
  # commit/ref this run was dispatched from, so the OTA always ships what
  # the operator actually selected - it never tries to align with whatever
  # is currently checked out on the seesam-hub host.
  #
  # Whether an OTA update is safe to publish for that commit is a human
  # judgment call: see docs/ota-native-changes.md for the rule (JS/TS-only
  # -> OTA is fine; any native-affecting change -> bump the app/runtime
  # version and ship a new EAS build first, do not use OTA).
  #
  # Concurrency is scoped to this job only, in its own per-channel group -
  # entirely separate from deploy's marketai-backend-deploy group above, so
  # this can never queue behind, cancel, or replace a pending/running
  # backend deploy (and vice versa). Two manual OTA runs for the same
  # channel still serialize against each other; preview and production
  # runs never block one another.
  publish-ota:
    name: Publish manual Expo OTA update
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    concurrency:
      group: marketai-ota-${{ inputs.ota_channel }}
      cancel-in-progress: false

    steps:
      - name: Restrict manual OTA to the deployment branch
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          if [ "$RUN_REF" != "refs/heads/feature/trading-system-foundation" ]; then
            echo "::error::Manual OTA runs are only allowed from refs/heads/feature/trading-system-foundation, not '${RUN_REF}'. Re-run this workflow with that branch selected."
            exit 1
          fi

      # Fail-safe gate: never publish a commit that hasn't itself gone
      # through a successful backend deploy + health check. This is an
      # explicit state comparison, not an assumption based on job/run
      # ordering or either job's concurrency group - those only serialize
      # same-kind runs against each other (and now never against each
      # other's kind), they say nothing about which commit was last
      # actually verified healthy.
      - name: Verify commit was already deployed to the backend
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          STATE_FILE="/home/marko/marketai-deploy-state/last-deployed-backend.sha"

          if [ ! -f "$STATE_FILE" ]; then
            echo "::error::No backend deploy has recorded a successful health check yet (${STATE_FILE} is missing). Refusing to publish OTA for ${DEPLOY_SHA}."
            exit 1
          fi

          DEPLOYED_SHA="$(tr -d '[:space:]' < "$STATE_FILE")"

          if [ "$DEPLOYED_SHA" != "$DEPLOY_SHA" ]; then
            echo "::error::Refusing to publish OTA for ${DEPLOY_SHA} - it does not match the last successfully deployed backend commit (${DEPLOYED_SHA:-<empty>}). Push this exact commit to feature/trading-system-foundation and wait for its backend deploy + health check to succeed before running this workflow again."
            exit 1
          fi

          echo "Commit ${DEPLOY_SHA} matches the last successfully deployed backend SHA - proceeding."

      - name: Checkout dispatched commit
        uses: actions/checkout@v4

      - name: Validate mobile app
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint

      - name: Publish OTA update
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          OTA_CHANNEL: ${{ inputs.ota_channel }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "Missing GitHub secret EXPO_TOKEN"; exit 1; }
          npx --yes eas-cli update \
            --channel "$OTA_CHANNEL" \
            --environment "$OTA_CHANNEL" \
            --message "Manual GitHub ${GITHUB_SHA}" \
            --non-interactive

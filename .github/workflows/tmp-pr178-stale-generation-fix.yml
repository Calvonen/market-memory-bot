name: Temporary PR178 cleanup

on:
  push:
    branches:
      - feature/official-release-source-control-api
    paths:
      - .github/workflows/tmp-pr178-stale-generation-fix.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/official-release-source-control-api
      - name: Remove temporary workflow
        run: |
          git config user.name 'Calvonen'
          git config user.email 'marko.raitanen@gmail.com'
          git rm .github/workflows/tmp-pr178-stale-generation-fix.yml
          git commit -m 'chore: remove temporary PR178 validation workflow'
          git push origin HEAD:feature/official-release-source-control-api

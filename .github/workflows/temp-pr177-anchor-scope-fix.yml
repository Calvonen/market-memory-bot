name: Temporary PR177 anchor scope fix

on:
  push:
    branches:
      - feature/results-page-release-provider

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/results-page-release-provider
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply scoped malformed-anchor fix and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('trading_system/results_page_release_candidates.py')
          text = source_path.read_text()

          replacements = []
          replacements.append((
          '''# The same identity mechanism for <base>: a base can be foster parented or
          # dropped, so tree position is not an identity for it either.
          _BASE_MARKER_PREFIX = "data-mmb-base-token-"
          ''',
          '''# The same identity mechanism for <base>: a base can be foster parented or
          # dropped, so tree position is not an identity for it either.
          _BASE_MARKER_PREFIX = "data-mmb-base-token-"
          # Only malformed duplicate/valueless anchor hrefs receive identity markers.
          # Instrumenting ordinary anchors can perturb malformed-HTML tree repair, so
          # safe anchors deliberately remain byte-for-byte unchanged before html5lib.
          _ANCHOR_MARKER_PREFIX = "data-mmb-anchor-token-"
          '''))
          replacements.append((
          '''        self.unsafe_hrefs: set[str] = set()
                  self.unsafe_anchor_structure = False
                  # href -> one entry per anchor occurrence in source order, each the set of
          ''',
          '''        self.unsafe_hrefs: set[str] = set()
                  # Stable identity is needed only for structurally malformed anchors.
                  self.malformed_anchor_spans: list[int] = []
                  self.malformed_anchor_templates: list[frozenset[int]] = []
                  # href -> one entry per anchor occurrence in source order, each the set of
          '''))
          replacements.append((
          '''    def _record_anchor(self, attrs: list[tuple[str, str | None]]) -> None:
                  href_attrs = [value for key, value in attrs if key.lower() == "href"]
                  hrefs = [value for value in href_attrs if value is not None]
                  raw_start_tag = self.get_starttag_text() or ""
                  if (
                      len(href_attrs) != 1
                      or len(hrefs) != 1
                      or not _raw_href_is_safe(raw_start_tag, hrefs[0])
                  ):
                      self.unsafe_hrefs.update(hrefs)
                      if href_attrs and (len(href_attrs) != 1 or len(hrefs) != 1):
                          self.unsafe_anchor_structure = True
                  enclosing = frozenset(self._open_templates)
                  for href in hrefs:
                      self.anchor_occurrences.setdefault(href, []).append(enclosing)
          ''',
          '''    def _record_anchor(self, attrs: list[tuple[str, str | None]]) -> None:
                  href_attrs = [value for key, value in attrs if key.lower() == "href"]
                  hrefs = [value for value in href_attrs if value is not None]
                  raw_start_tag = self.get_starttag_text() or ""
                  enclosing = frozenset(self._open_templates)
                  malformed_structure = bool(href_attrs) and (
                      len(href_attrs) != 1 or len(hrefs) != 1
                  )
                  if malformed_structure:
                      self.malformed_anchor_spans.append(self._source_offset())
                      self.malformed_anchor_templates.append(enclosing)
                  elif len(hrefs) == 1 and not _raw_href_is_safe(raw_start_tag, hrefs[0]):
                      self.unsafe_hrefs.add(hrefs[0])

                  for href in hrefs:
                      self.anchor_occurrences.setdefault(href, []).append(enclosing)
          '''))
          replacements.append((
          '''    instrumented = _instrument_raw_start_tags(
                  html_text,
                  (
                      ("template", _TEMPLATE_MARKER_PREFIX, probe.template_spans),
                      ("base", _BASE_MARKER_PREFIX, probe.base_spans),
                  ),
              )
          ''',
          '''    plans: list[tuple[str, str, list[int]]] = [
                  ("template", _TEMPLATE_MARKER_PREFIX, probe.template_spans),
                  ("base", _BASE_MARKER_PREFIX, probe.base_spans),
              ]
              if probe.malformed_anchor_spans:
                  plans.append(("a", _ANCHOR_MARKER_PREFIX, probe.malformed_anchor_spans))
              instrumented = _instrument_raw_start_tags(html_text, tuple(plans))
          '''))
          replacements.append((
          '''    return scanner, fragment, html_templates, markers.get("base")
          ''',
          '''    return scanner, fragment, html_templates, markers.get("base"), markers.get("a")
          '''))
          replacements.append((
          '''    scanner, _fragment, html_templates, _base_marker = _scan_and_parse(html_text)
          ''',
          '''    scanner, _fragment, html_templates, _base_marker, _anchor_marker = _scan_and_parse(html_text)
          '''))
          replacements.append((
          '''    safety_scanner, fragment, html_templates, base_marker = _scan_and_parse(html_text)
          ''',
          '''    safety_scanner, fragment, html_templates, base_marker, anchor_marker = _scan_and_parse(html_text)
          '''))

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected source snippet not found:\n{old[:200]}')
              text = text.replace(old, new, 1)

          start = text.index('def _iter_visible_html_anchors(root):\n')
          end = text.index('\n\n_BASE_FAILED_CLOSED = object()\n', start)
          helper = '''\n\ndef _has_candidate_relevant_malformed_anchor(
              root,
              safety_scanner,
              html_templates: frozenset[int],
              anchor_marker: str | None,
          ) -> bool:
              """Whether a malformed href occurrence can survive as a visible candidate."""
              relevant_tokens = {
                  token
                  for token, enclosing in enumerate(safety_scanner.malformed_anchor_templates)
                  if not (enclosing & html_templates)
              }
              if not relevant_tokens:
                  return False
              if anchor_marker is None:
                  return True

              token_count = len(safety_scanner.malformed_anchor_templates)
              for anchor in _iter_visible_html_anchors(root):
                  token = _marker_token(anchor, anchor_marker)
                  if token is None:
                      continue
                  if not 0 <= token < token_count:
                      return True
                  if token in relevant_tokens:
                      return True
              return False
          '''
          text = text[:end] + helper + text[end:]

          old = '''    if safety_scanner.unsafe_anchor_structure:
                  return _ANCHOR_STRUCTURE_FAILED_CLOSED
          '''
          new = '''    if _has_candidate_relevant_malformed_anchor(
                  fragment, safety_scanner, html_templates, anchor_marker
              ):
                  return _ANCHOR_STRUCTURE_FAILED_CLOSED
          '''
          if old not in text:
              raise SystemExit('parse anchor-structure branch not found')
          text = text.replace(old, new, 1)
          source_path.write_text(text)

          test_path = Path('tests/test_results_page_release_provider.py')
          tests = test_path.read_text()
          insertion_point = '    def test_single_empty_href_does_not_poison_other_candidates(self) -> None:\n'
          if insertion_point not in tests:
              raise SystemExit('test insertion point not found')
          new_tests = '''    def test_hidden_malformed_anchor_does_not_poison_visible_release_candidate(self) -> None:
                  document_url = "https://investor.example.com/reports/2026-08-26-results.html"
                  provider = self._provider()
                  document, opener = self._discover(
                      provider,
                      {
                          PAGE_URL: self._page(
                              '<div hidden><a href href="/bad">Hidden malformed</a></div>'
                              '<a href="/reports/2026-08-26-results.html">Half-year results</a>'
                          ),
                          document_url: _Response(_release_html(), final_url=document_url),
                      },
                  )
                  self.assertIsNotNone(document)
                  self.assertEqual(document.source_url, document_url)
                  self.assertEqual(opener.opened, [PAGE_URL, document_url])

              def test_template_local_malformed_anchor_does_not_poison_visible_release_candidate(self) -> None:
                  document_url = "https://investor.example.com/reports/2026-08-26-results.html"
                  provider = self._provider()
                  document, opener = self._discover(
                      provider,
                      {
                          PAGE_URL: self._page(
                              '<template><a href href="/bad">Template malformed</a></template>'
                              '<a href="/reports/2026-08-26-results.html">Half-year results</a>'
                          ),
                          document_url: _Response(_release_html(), final_url=document_url),
                      },
                  )
                  self.assertIsNotNone(document)
                  self.assertEqual(document.source_url, document_url)
                  self.assertEqual(opener.opened, [PAGE_URL, document_url])

              def test_visible_malformed_anchor_still_fails_before_document_fetch(self) -> None:
                  provider = self._provider()
                  document, opener = self._discover(
                      provider,
                      {
                          PAGE_URL: self._page(
                              '<a href href="/reports/2026-08-26-results.html">Half-year results</a>'
                          )
                      },
                  )
                  self.assertIsNone(document)
                  self.assertEqual(opener.opened, [PAGE_URL])
                  reason = provider.describe_no_release()
                  self.assertIsNotNone(reason)
                  self.assertIn("anchor_structure_failed", reason)

          '''
          tests = tests.replace(insertion_point, new_tests + insertion_point, 1)
          test_path.write_text(tests)
          PY

      - name: Validate syntax and patch
        run: |
          python -m py_compile trading_system/results_page_release_candidates.py tests/test_results_page_release_provider.py
          git diff --check

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -q

      - name: Run focused results-page unittest suite
        run: python -m unittest discover -s tests -p 'test_results_page_release*.py' -v

      - name: Run full unittest suite
        run: python -m unittest discover -s tests -v

      - name: Commit fix and remove temporary workflow
        if: success()
        run: |
          rm .github/workflows/temp-pr177-anchor-scope-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trading_system/results_page_release_candidates.py tests/test_results_page_release_provider.py .github/workflows/temp-pr177-anchor-scope-fix.yml
          git commit -m "fix: scope malformed anchors to visible candidates"
          git push origin HEAD:feature/results-page-release-provider

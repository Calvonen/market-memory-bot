name: Temporary PR178 review fix validation

on:
  push:
    branches:
      - feature/official-release-source-control-api

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/official-release-source-control-api
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply review fixes
        run: python .github/scripts/apply_pr178_review_fixes.py
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile and diff check
        run: |
          python -m py_compile trading_system/api.py trading_system/official_release_source_repository.py tests/test_official_release_source_control_api.py tests/test_official_release_source_approval_audit_sql.py
          git diff --check
      - name: Focused tests
        run: python -m unittest discover -s tests -p 'test_official_release_source*.py' -v
      - name: Full canonical suite
        run: python -m unittest discover -s tests -v
      - name: Commit validated fixes
        run: |
          rm .github/workflows/tmp-pr178-review-fixes.yml
          rm .github/scripts/apply_pr178_review_fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A trading_system/api.py tests/test_official_release_source_control_api.py tests/test_official_release_source_approval_audit_sql.py .github/workflows/tmp-pr178-review-fixes.yml .github/scripts/apply_pr178_review_fixes.py
          git commit -m "fix: address official release source review findings"
          git push origin HEAD:feature/official-release-source-control-api

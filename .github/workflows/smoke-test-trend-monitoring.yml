name: Smoke test Trend monitoring

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Observation window in minutes (1-30)"
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  smoke:
    name: Run temporary Trend observation smoke test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 40
    concurrency:
      group: marketai-trend-monitoring-control
      cancel-in-progress: false

    steps:
      - name: Restrict run to deployment branch
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          if [ "$RUN_REF" != "refs/heads/feature/trading-system-foundation" ]; then
            echo "::error::Run this workflow only from feature/trading-system-foundation."
            exit 1
          fi

      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Run temporary observation-only smoke test
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
        run: |
          set -euo pipefail
          LOCK_FILE="/tmp/marketai-deploy-ota.lock"
          CONTROL_LOCK_FILE="/tmp/marketai-trend-monitoring-control.lock"
          LOCK_TIMEOUT_SECONDS=300
          RUNTIME_DIR="/home/marko/marketai-repo"
          STATE_DIR="/home/marko/marketai-deploy-state"
          STATE_FILE="$STATE_DIR/last-deployed-backend.sha"
          PREPARED_STATE_FILE="$STATE_DIR/trend-monitoring-prepared.sha"
          SERVICE="marketai-trend-monitoring.service"
          UNIT_FILE="/etc/systemd/system/marketai-trend-monitoring.service"
          EXPECTED_UNIT_FILE="$RUNTIME_DIR/deploy/systemd/marketai-trend-monitoring.service"
          EXPECTED_ENV_FILE="/home/marko/marketai/.env"

          case "$DURATION_MINUTES" in
            ''|*[!0-9]*)
              echo "::error::duration_minutes must be an integer from 1 to 30."
              exit 1
              ;;
          esac
          if [ "$DURATION_MINUTES" -lt 1 ] || [ "$DURATION_MINUTES" -gt 30 ]; then
            echo "::error::duration_minutes must be between 1 and 30."
            exit 1
          fi

          exec 200>"$LOCK_FILE"
          if ! flock -w "$LOCK_TIMEOUT_SECONDS" 200; then
            echo "::error::Could not acquire the MarketAI deploy/OTA lock within ${LOCK_TIMEOUT_SECONDS}s."
            exit 1
          fi
          exec 201>"$CONTROL_LOCK_FILE"
          if ! flock -w "$LOCK_TIMEOUT_SECONDS" 201; then
            echo "::error::Could not acquire Trend monitoring control lock within ${LOCK_TIMEOUT_SECONDS}s."
            exit 1
          fi

          verify_exact_runtime() {
            test -f "$STATE_FILE" || { echo "::error::No deployed backend SHA recorded."; return 1; }
            test -f "$PREPARED_STATE_FILE" || { echo "::error::Trend worker has not been prepared for this runtime."; return 1; }
            DEPLOYED_SHA="$(tr -d '[:space:]' < "$STATE_FILE")"
            PREPARED_SHA="$(tr -d '[:space:]' < "$PREPARED_STATE_FILE")"
            if [ "$DEPLOYED_SHA" != "$DEPLOY_SHA" ] || [ "$PREPARED_SHA" != "$DEPLOY_SHA" ]; then
              echo "::error::Smoke-test SHA ${DEPLOY_SHA} must match deployed ${DEPLOYED_SHA:-missing} and prepared ${PREPARED_SHA:-missing} SHA."
              return 1
            fi
            cd "$RUNTIME_DIR"
            RUNTIME_SHA="$(git rev-parse HEAD)"
            if [ "$RUNTIME_SHA" != "$DEPLOY_SHA" ]; then
              echo "::error::Runtime checkout ${RUNTIME_SHA} does not match smoke-test SHA ${DEPLOY_SHA}."
              return 1
            fi
            test "$(git branch --show-current)" = "feature/trading-system-foundation" || {
              echo "::error::Production runtime is not on feature/trading-system-foundation."
              return 1
            }
            test -z "$(git status --porcelain --untracked-files=no)" || {
              echo "::error::Production runtime has tracked working-tree changes."
              return 1
            }
          }

          verify_disabled_quiescent() {
            if ! LOAD_STATE="$(/usr/bin/systemctl show "$SERVICE" --property=LoadState --value 2>&1)"; then
              echo "::error::Could not inspect $SERVICE LoadState: ${LOAD_STATE:-unknown error}."
              return 1
            fi
            if [ "$LOAD_STATE" != "loaded" ]; then
              echo "::error::$SERVICE must already be installed and loaded (LoadState=${LOAD_STATE:-unknown})."
              return 1
            fi
            if ! JOBS_OUTPUT="$(/usr/bin/systemctl list-jobs --no-legend --plain 2>&1)"; then
              echo "::error::Could not inspect queued systemd jobs: ${JOBS_OUTPUT:-unknown error}."
              return 1
            fi
            if printf '%s\n' "$JOBS_OUTPUT" | grep -Eq '^[[:space:]]*[0-9]+[[:space:]]+marketai-trend-monitoring\.service[[:space:]]'; then
              echo "::error::$SERVICE has a queued systemd job."
              return 1
            fi
            if ! ENABLED_STATE="$(/usr/bin/systemctl is-enabled "$SERVICE" 2>&1)"; then
              if [ "$ENABLED_STATE" != "disabled" ]; then
                echo "::error::Could not establish that $SERVICE is disabled (state: ${ENABLED_STATE:-unknown})."
                return 1
              fi
            fi
            if [ "$ENABLED_STATE" != "disabled" ]; then
              echo "::error::$SERVICE must remain disabled (state: ${ENABLED_STATE:-unknown})."
              return 1
            fi
            if ! ACTIVE_STATE="$(/usr/bin/systemctl show "$SERVICE" --property=ActiveState --value 2>&1)"; then
              echo "::error::Could not inspect $SERVICE ActiveState: ${ACTIVE_STATE:-unknown error}."
              return 1
            fi
            if ! SUB_STATE="$(/usr/bin/systemctl show "$SERVICE" --property=SubState --value 2>&1)"; then
              echo "::error::Could not inspect $SERVICE SubState: ${SUB_STATE:-unknown error}."
              return 1
            fi
            if [ "$ACTIVE_STATE" = "failed" ] && [ "$SUB_STATE" = "failed" ]; then
              sudo /usr/bin/systemctl reset-failed "$SERVICE"
              if ! ACTIVE_STATE="$(/usr/bin/systemctl show "$SERVICE" --property=ActiveState --value 2>&1)"; then
                echo "::error::Could not re-check $SERVICE ActiveState after reset-failed: ${ACTIVE_STATE:-unknown error}."
                return 1
              fi
              if ! SUB_STATE="$(/usr/bin/systemctl show "$SERVICE" --property=SubState --value 2>&1)"; then
                echo "::error::Could not re-check $SERVICE SubState after reset-failed: ${SUB_STATE:-unknown error}."
                return 1
              fi
            fi
            if [ "$ACTIVE_STATE" != "inactive" ] || [ "$SUB_STATE" != "dead" ]; then
              echo "::error::$SERVICE must start from inactive/dead (ActiveState=${ACTIVE_STATE}, SubState=${SUB_STATE})."
              return 1
            fi
          }

          verify_effective_unit() {
            test -f "$UNIT_FILE" || { echo "::error::Installed Trend unit is missing: $UNIT_FILE"; return 1; }
            test -f "$EXPECTED_UNIT_FILE" || { echo "::error::Expected Trend unit is missing from runtime: $EXPECTED_UNIT_FILE"; return 1; }
            if ! cmp -s "$UNIT_FILE" "$EXPECTED_UNIT_FILE"; then
              echo "::error::Installed Trend unit differs from the exact deployed runtime unit."
              return 1
            fi

            if ! FRAGMENT_PATH="$(/usr/bin/systemctl show "$SERVICE" --property=FragmentPath --value 2>&1)"; then
              echo "::error::Could not inspect $SERVICE FragmentPath: ${FRAGMENT_PATH:-unknown error}."
              return 1
            fi
            if [ "$FRAGMENT_PATH" != "$UNIT_FILE" ]; then
              echo "::error::$SERVICE effective fragment is unexpected: ${FRAGMENT_PATH:-unknown}."
              return 1
            fi
            if ! DROP_INS="$(/usr/bin/systemctl show "$SERVICE" --property=DropInPaths --value 2>&1)"; then
              echo "::error::Could not inspect $SERVICE DropInPaths: ${DROP_INS:-unknown error}."
              return 1
            fi
            if [ -n "$DROP_INS" ]; then
              echo "::error::$SERVICE has unexpected drop-ins: $DROP_INS"
              return 1
            fi
            if ! NEED_RELOAD="$(/usr/bin/systemctl show "$SERVICE" --property=NeedDaemonReload --value 2>&1)"; then
              echo "::error::Could not inspect $SERVICE NeedDaemonReload: ${NEED_RELOAD:-unknown error}."
              return 1
            fi
            if [ "$NEED_RELOAD" != "no" ]; then
              echo "::error::$SERVICE has stale loaded configuration (NeedDaemonReload=${NEED_RELOAD:-unknown})."
              return 1
            fi

            for PROPERTY in ExecCondition ExecStartPre ExecStartPost ExecReload ExecStop ExecStopPost; do
              if ! COMMANDS="$(/usr/bin/systemctl show "$SERVICE" --property="$PROPERTY" --value 2>&1)"; then
                echo "::error::Could not inspect $SERVICE $PROPERTY: ${COMMANDS:-unknown error}."
                return 1
              fi
              if [ -n "$COMMANDS" ]; then
                echo "::error::$SERVICE has unexpected effective $PROPERTY commands: $COMMANDS"
                return 1
              fi
            done

            if ! ENV_FILES="$(/usr/bin/systemctl show "$SERVICE" --property=EnvironmentFiles --value 2>&1)"; then
              echo "::error::Could not inspect $SERVICE EnvironmentFiles: ${ENV_FILES:-unknown error}."
              return 1
            fi
            case "$ENV_FILES" in
              "$EXPECTED_ENV_FILE"|"$EXPECTED_ENV_FILE (ignore_errors=no)")
                ;;
              *)
                echo "::error::$SERVICE effective EnvironmentFiles are unexpected: ${ENV_FILES:-none}."
                return 1
                ;;
            esac
          }

          cleanup() {
            set +e
            sudo /usr/bin/systemctl stop "$SERVICE"
            sudo /usr/bin/systemctl disable "$SERVICE"
            set -e
            ENABLED_STATE="$(/usr/bin/systemctl is-enabled "$SERVICE" 2>/dev/null || true)"
            ACTIVE_STATE="$(/usr/bin/systemctl show "$SERVICE" --property=ActiveState --value 2>/dev/null || true)"
            SUB_STATE="$(/usr/bin/systemctl show "$SERVICE" --property=SubState --value 2>/dev/null || true)"
            if [ "$ENABLED_STATE" != "disabled" ] || [ "$ACTIVE_STATE" != "inactive" ] || [ "$SUB_STATE" != "dead" ]; then
              echo "::error::Cleanup did not leave $SERVICE disabled and inactive/dead (enabled=${ENABLED_STATE:-unknown}, active=${ACTIVE_STATE:-unknown}, sub=${SUB_STATE:-unknown})."
              return 1
            fi
          }

          verify_exact_runtime
          verify_disabled_quiescent
          verify_effective_unit

          # Only after every precondition is accepted do we take ownership of
          # this invocation and arm cleanup. A rejected smoke test must never
          # stop/disable a service or queued job that it did not create.
          trap cleanup EXIT

          sudo /usr/bin/systemctl start "$SERVICE"
          if [ "$(/usr/bin/systemctl is-active "$SERVICE" 2>/dev/null || true)" != "active" ]; then
            /usr/bin/journalctl -u "$SERVICE" --no-pager -o cat -n 100 || true
            echo "::error::$SERVICE failed to become active."
            exit 1
          fi

          if ! INVOCATION_ID="$(/usr/bin/systemctl show "$SERVICE" --property=InvocationID --value 2>&1)"; then
            echo "::error::Could not inspect $SERVICE InvocationID: ${INVOCATION_ID:-unknown error}."
            exit 1
          fi
          if [ -z "$INVOCATION_ID" ]; then
            echo "::error::$SERVICE has no InvocationID after start."
            exit 1
          fi
          if ! RESTART_COUNT="$(/usr/bin/systemctl show "$SERVICE" --property=NRestarts --value 2>&1)"; then
            echo "::error::Could not inspect $SERVICE NRestarts: ${RESTART_COUNT:-unknown error}."
            exit 1
          fi

          echo "Running observation-only Trend smoke test for ${DURATION_MINUTES} minute(s)."
          sleep "$((DURATION_MINUTES * 60))"

          if [ "$(/usr/bin/systemctl is-active "$SERVICE" 2>/dev/null || true)" != "active" ]; then
            /usr/bin/journalctl _SYSTEMD_INVOCATION_ID="$INVOCATION_ID" --no-pager -o cat || true
            echo "::error::$SERVICE stopped unexpectedly during the smoke test."
            exit 1
          fi
          if ! CURRENT_INVOCATION_ID="$(/usr/bin/systemctl show "$SERVICE" --property=InvocationID --value 2>&1)"; then
            echo "::error::Could not re-check $SERVICE InvocationID: ${CURRENT_INVOCATION_ID:-unknown error}."
            exit 1
          fi
          if [ "$CURRENT_INVOCATION_ID" != "$INVOCATION_ID" ]; then
            echo "::error::$SERVICE restarted during the smoke test (invocation ${INVOCATION_ID} -> ${CURRENT_INVOCATION_ID:-missing})."
            exit 1
          fi
          if ! CURRENT_RESTART_COUNT="$(/usr/bin/systemctl show "$SERVICE" --property=NRestarts --value 2>&1)"; then
            echo "::error::Could not re-check $SERVICE NRestarts: ${CURRENT_RESTART_COUNT:-unknown error}."
            exit 1
          fi
          if [ "$CURRENT_RESTART_COUNT" != "$RESTART_COUNT" ]; then
            echo "::error::$SERVICE restart count changed during the smoke test (${RESTART_COUNT} -> ${CURRENT_RESTART_COUNT})."
            exit 1
          fi

          JOURNAL_OUTPUT="$(/usr/bin/journalctl _SYSTEMD_INVOCATION_ID="$INVOCATION_ID" --no-pager -o cat)"
          printf '%s\n' "$JOURNAL_OUTPUT"
          if ! printf '%s\n' "$JOURNAL_OUTPUT" | grep -q '"type": "trend_observation"'; then
            echo "::error::No Trend observation JSON was emitted by this service invocation during the smoke-test window."
            exit 1
          fi

          verify_exact_runtime
          echo "Trend observation smoke test produced at least one observation without restart; cleanup will stop the worker and keep it disabled."

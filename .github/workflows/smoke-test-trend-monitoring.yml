name: Smoke test Trend monitoring

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Observation window in minutes (1-30)"
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  smoke:
    name: Run temporary Trend observation smoke test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 40
    concurrency:
      group: marketai-trend-monitoring-control
      cancel-in-progress: false

    steps:
      - name: Restrict run to deployment branch
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          if [ "$RUN_REF" != "refs/heads/feature/trading-system-foundation" ]; then
            echo "::error::Run this workflow only from feature/trading-system-foundation."
            exit 1
          fi

      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Run temporary observation-only smoke test
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
        run: |
          set -euo pipefail
          LOCK_FILE="/tmp/marketai-deploy-ota.lock"
          CONTROL_LOCK_FILE="/tmp/marketai-trend-monitoring-control.lock"
          LOCK_TIMEOUT_SECONDS=300
          RUNTIME_DIR="/home/marko/marketai-repo"
          STATE_DIR="/home/marko/marketai-deploy-state"
          STATE_FILE="$STATE_DIR/last-deployed-backend.sha"
          PREPARED_STATE_FILE="$STATE_DIR/trend-monitoring-prepared.sha"
          SERVICE="marketai-trend-monitoring.service"

          case "$DURATION_MINUTES" in
            ''|*[!0-9]*)
              echo "::error::duration_minutes must be an integer from 1 to 30."
              exit 1
              ;;
          esac
          if [ "$DURATION_MINUTES" -lt 1 ] || [ "$DURATION_MINUTES" -gt 30 ]; then
            echo "::error::duration_minutes must be between 1 and 30."
            exit 1
          fi

          exec 200>"$LOCK_FILE"
          if ! flock -w "$LOCK_TIMEOUT_SECONDS" 200; then
            echo "::error::Could not acquire the MarketAI deploy/OTA lock within ${LOCK_TIMEOUT_SECONDS}s."
            exit 1
          fi
          exec 201>"$CONTROL_LOCK_FILE"
          if ! flock -w "$LOCK_TIMEOUT_SECONDS" 201; then
            echo "::error::Could not acquire Trend monitoring control lock within ${LOCK_TIMEOUT_SECONDS}s."
            exit 1
          fi

          verify_exact_runtime() {
            test -f "$STATE_FILE" || { echo "::error::No deployed backend SHA recorded."; return 1; }
            test -f "$PREPARED_STATE_FILE" || { echo "::error::Trend worker has not been prepared for this runtime."; return 1; }
            DEPLOYED_SHA="$(tr -d '[:space:]' < "$STATE_FILE")"
            PREPARED_SHA="$(tr -d '[:space:]' < "$PREPARED_STATE_FILE")"
            if [ "$DEPLOYED_SHA" != "$DEPLOY_SHA" ] || [ "$PREPARED_SHA" != "$DEPLOY_SHA" ]; then
              echo "::error::Smoke-test SHA ${DEPLOY_SHA} must match deployed ${DEPLOYED_SHA:-missing} and prepared ${PREPARED_SHA:-missing} SHA."
              return 1
            fi
            cd "$RUNTIME_DIR"
            RUNTIME_SHA="$(git rev-parse HEAD)"
            if [ "$RUNTIME_SHA" != "$DEPLOY_SHA" ]; then
              echo "::error::Runtime checkout ${RUNTIME_SHA} does not match smoke-test SHA ${DEPLOY_SHA}."
              return 1
            fi
            test "$(git branch --show-current)" = "feature/trading-system-foundation" || {
              echo "::error::Production runtime is not on feature/trading-system-foundation."
              return 1
            }
            test -z "$(git status --porcelain --untracked-files=no)" || {
              echo "::error::Production runtime has tracked working-tree changes."
              return 1
            }
          }

          verify_disabled_quiescent() {
            if ! LOAD_STATE="$(/usr/bin/systemctl show "$SERVICE" --property=LoadState --value 2>&1)"; then
              echo "::error::Could not inspect $SERVICE LoadState: ${LOAD_STATE:-unknown error}."
              return 1
            fi
            if [ "$LOAD_STATE" != "loaded" ]; then
              echo "::error::$SERVICE must already be installed and loaded (LoadState=${LOAD_STATE:-unknown})."
              return 1
            fi
            if ! JOBS_OUTPUT="$(/usr/bin/systemctl list-jobs --no-legend --plain 2>&1)"; then
              echo "::error::Could not inspect queued systemd jobs: ${JOBS_OUTPUT:-unknown error}."
              return 1
            fi
            if printf '%s\n' "$JOBS_OUTPUT" | grep -Eq '^[[:space:]]*[0-9]+[[:space:]]+marketai-trend-monitoring\.service[[:space:]]'; then
              echo "::error::$SERVICE has a queued systemd job."
              return 1
            fi
            ENABLED_STATE="$(/usr/bin/systemctl is-enabled "$SERVICE" 2>/dev/null || true)"
            if [ "$ENABLED_STATE" != "disabled" ]; then
              echo "::error::$SERVICE must remain disabled (state: ${ENABLED_STATE:-unknown})."
              return 1
            fi
            ACTIVE_STATE="$(/usr/bin/systemctl show "$SERVICE" --property=ActiveState --value)"
            SUB_STATE="$(/usr/bin/systemctl show "$SERVICE" --property=SubState --value)"
            if [ "$ACTIVE_STATE" != "inactive" ] || [ "$SUB_STATE" != "dead" ]; then
              echo "::error::$SERVICE must start from inactive/dead (ActiveState=${ACTIVE_STATE}, SubState=${SUB_STATE})."
              return 1
            fi
          }

          cleanup() {
            set +e
            sudo /usr/bin/systemctl stop "$SERVICE"
            sudo /usr/bin/systemctl disable "$SERVICE"
            set -e
            ENABLED_STATE="$(/usr/bin/systemctl is-enabled "$SERVICE" 2>/dev/null || true)"
            ACTIVE_STATE="$(/usr/bin/systemctl show "$SERVICE" --property=ActiveState --value 2>/dev/null || true)"
            SUB_STATE="$(/usr/bin/systemctl show "$SERVICE" --property=SubState --value 2>/dev/null || true)"
            if [ "$ENABLED_STATE" != "disabled" ] || [ "$ACTIVE_STATE" != "inactive" ] || [ "$SUB_STATE" != "dead" ]; then
              echo "::error::Cleanup did not leave $SERVICE disabled and inactive/dead (enabled=${ENABLED_STATE:-unknown}, active=${ACTIVE_STATE:-unknown}, sub=${SUB_STATE:-unknown})."
              return 1
            fi
          }
          trap cleanup EXIT

          verify_exact_runtime
          verify_disabled_quiescent

          START_EPOCH="$(date +%s)"
          sudo /usr/bin/systemctl start "$SERVICE"
          if [ "$(/usr/bin/systemctl is-active "$SERVICE" 2>/dev/null || true)" != "active" ]; then
            sudo /usr/bin/journalctl -u "$SERVICE" --since "@${START_EPOCH}" --no-pager -o cat || true
            echo "::error::$SERVICE failed to become active."
            exit 1
          fi

          echo "Running observation-only Trend smoke test for ${DURATION_MINUTES} minute(s)."
          sleep "$((DURATION_MINUTES * 60))"

          if [ "$(/usr/bin/systemctl is-active "$SERVICE" 2>/dev/null || true)" != "active" ]; then
            sudo /usr/bin/journalctl -u "$SERVICE" --since "@${START_EPOCH}" --no-pager -o cat || true
            echo "::error::$SERVICE stopped unexpectedly during the smoke test."
            exit 1
          fi

          JOURNAL_OUTPUT="$(sudo /usr/bin/journalctl -u "$SERVICE" --since "@${START_EPOCH}" --no-pager -o cat)"
          printf '%s\n' "$JOURNAL_OUTPUT"
          if ! printf '%s\n' "$JOURNAL_OUTPUT" | grep -q '"type": "trend_observation"'; then
            echo "::error::No Trend observation JSON was emitted during the smoke-test window."
            exit 1
          fi

          verify_exact_runtime
          echo "Trend observation smoke test produced at least one observation; cleanup will stop the worker and keep it disabled."

name: Temporary PR178 audit integrity v3 validation

on:
  push:
    branches:
      - feature/official-release-source-control-api

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused patch
        run: |
          python - <<'PY'
          from pathlib import Path

          gate = Path('scripts/verify_supabase_schema.py')
          gate.write_text(gate.read_text().replace('REQUIRED_OFFICIAL_RELEASE_SOURCE_SCHEMA_VERSION = 2', 'REQUIRED_OFFICIAL_RELEASE_SOURCE_SCHEMA_VERSION = 3', 1))

          tests = Path('tests/test_official_release_source_repository.py')
          text = tests.read_text()
          if 'rpc_rows_by_name' not in text:
              text = text.replace('''    def __init__(self, *, response_rows=None, rpc_rows=None):\n        self.response_rows = response_rows\n        self.rpc_rows = [] if rpc_rows is None else rpc_rows\n''', '''    def __init__(self, *, response_rows=None, rpc_rows=None, rpc_rows_by_name=None):\n        self.response_rows = response_rows\n        self.rpc_rows = [] if rpc_rows is None else rpc_rows\n        self.rpc_rows_by_name = rpc_rows_by_name or {}\n''', 1)
              text = text.replace('''    def rpc(self, name, payload):\n        self.rpc_calls.append((name, payload))\n        return _RpcQuery(self.rpc_rows)\n''', '''    def rpc(self, name, payload):\n        self.rpc_calls.append((name, payload))\n        rows = self.rpc_rows_by_name.get(name, self.rpc_rows)\n        return _RpcQuery(rows)\n''', 1)
              start = text.index('    def test_get_returns_validated_canonical_source(self):')
              end = text.index('    def test_set_uses_atomic_rpc_with_expected_version(self):')
              replacement = '''    def _state_client(self, *, active, version, kind=None, url=None, title=None):\n        return _Client(rpc_rows_by_name={\n            "get_audited_official_release_source_state": [{\n                "out_event_id": self.EVENT_ID,\n                "out_source_kind": kind,\n                "out_source_url": url,\n                "out_source_title": title,\n                "out_is_active": active,\n                "out_version": version,\n            }]\n        })\n\n    def test_get_returns_validated_canonical_source(self):\n        client = self._state_client(active=True, version=3, kind="results_page", url="https://investor.example.com/results", title="Investor results")\n        repository = SupabaseOfficialReleaseSourceRepository(client)\n        source = repository.get(self.EVENT_ID)\n        self.assertIsNotNone(source)\n        assert source is not None\n        self.assertEqual(source.source_kind, "results_page")\n        self.assertEqual(source.version, 3)\n        self.assertEqual(client.rpc_calls, [("get_audited_official_release_source_state", {"input_event_id": self.EVENT_ID})])\n\n    def test_get_missing_source_returns_none_and_version_zero(self):\n        state = SupabaseOfficialReleaseSourceRepository(self._state_client(active=False, version=0)).get_state(self.EVENT_ID)\n        self.assertIsNone(state.source)\n        self.assertEqual(state.version, 0)\n\n    def test_get_tombstone_returns_none_but_preserves_version(self):\n        state = SupabaseOfficialReleaseSourceRepository(self._state_client(active=False, version=4)).get_state(self.EVENT_ID)\n        self.assertIsNone(state.source)\n        self.assertEqual(state.version, 4)\n\n    def test_unaudited_active_source_is_returned_inactive_by_state_rpc(self):\n        state = SupabaseOfficialReleaseSourceRepository(self._state_client(active=False, version=7)).get_state(self.EVENT_ID)\n        self.assertIsNone(state.source)\n        self.assertEqual(state.version, 7)\n\n    def test_get_malformed_persisted_source_fails_closed(self):\n        repository = SupabaseOfficialReleaseSourceRepository(self._state_client(active=True, version=1, kind="direct_url", url="not-a-url"))\n        with self.assertRaisesRegex(RuntimeError, "row is malformed"):\n            repository.get(self.EVENT_ID)\n\n'''
              text = text[:start] + replacement + text[end:]
              tests.write_text(text)

          sqltests = Path('tests/test_official_release_source_approval_audit_sql.py')
          text = sqltests.read_text()
          if 'INTEGRITY_MIGRATION' not in text:
              text = text.replace('MIGRATION = Path("supabase/migrations/20260902104000_official_release_source_approval_audit.sql")\n', 'MIGRATION = Path("supabase/migrations/20260902104000_official_release_source_approval_audit.sql")\nINTEGRITY_MIGRATION = Path("supabase/migrations/20260902105000_official_release_source_audit_integrity.sql")\n', 1)
              text = text.replace('        cls.schema_gate = SCHEMA_GATE.read_text()\n', '        cls.schema_gate = SCHEMA_GATE.read_text()\n        cls.integrity_sql = INTEGRITY_MIGRATION.read_text()\n', 1)
              marker = '    def test_schema_gate_has_distinct_audited_contract_version(self):\n'
              addition = '''    def test_v3_drains_advisory_queues_and_rejects_unaudited_active_rows(self):\n        self.assertIn("pg_advisory_xact_lock(hashtextextended(item.event_id, 2))", self.integrity_sql)\n        self.assertIn("migration:post-revoke-unaudited-source", self.integrity_sql)\n        self.assertIn("migration:post-revoke-unaudited-invalidation", self.integrity_sql)\n        self.assertIn("get_audited_official_release_source_state", self.integrity_sql)\n        self.assertIn("audit.version = source_row.version", self.integrity_sql)\n        self.assertIn("source_row.is_active and audited_active", self.integrity_sql)\n\n    def test_v3_preserves_source_generation_across_event_deletion(self):\n        self.assertIn("drop constraint if exists event_official_release_sources_event_id_fkey", self.integrity_sql)\n        self.assertIn("tombstone_official_release_source_before_event_delete", self.integrity_sql)\n        self.assertIn("system:market-event-delete", self.integrity_sql)\n        self.assertIn("before delete on public.market_events", self.integrity_sql)\n        self.assertIn("    3;", self.integrity_sql)\n\n'''
              if marker not in text: raise SystemExit('sql test marker not found')
              text = text.replace(marker, addition + marker, 1)
          text = text.replace('REQUIRED_OFFICIAL_RELEASE_SOURCE_SCHEMA_VERSION = 2', 'REQUIRED_OFFICIAL_RELEASE_SOURCE_SCHEMA_VERSION = 3')
          sqltests.write_text(text)

          verifytests = Path('tests/test_verify_supabase_schema.py')
          text = verifytests.read_text()
          text = text.replace('"official_release_source_schema_version": 2', '"official_release_source_schema_version": 3')
          text = text.replace('official-release-source schema version 2', 'official-release-source schema version 3')
          verifytests.write_text(text)
          PY
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Validate
        run: |
          python -m py_compile trading_system/official_release_source_repository.py scripts/verify_supabase_schema.py tests/test_official_release_source_repository.py tests/test_official_release_source_approval_audit_sql.py tests/test_verify_supabase_schema.py
          git diff --check
          python -m unittest discover -s tests -p 'test_official_release_source*.py' -v
          python -m unittest tests.test_verify_supabase_schema -v
          python -m unittest discover -s tests -v
      - name: Commit validated fix
        run: |
          git config user.name Calvonen
          git config user.email marko.raitanen@gmail.com
          git add scripts/verify_supabase_schema.py tests/test_official_release_source_repository.py tests/test_official_release_source_approval_audit_sql.py tests/test_verify_supabase_schema.py
          if ! git diff --cached --quiet; then
            git commit -m 'test: cover official source audit integrity v3'
            git push
          fi

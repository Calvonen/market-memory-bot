name: Temporary PR178 input error validation

on:
  push:
    branches:
      - feature/official-release-source-control-api

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Validate
        run: |
          python -m py_compile trading_system/official_release_source_repository.py tests/test_official_release_source_repository.py
          git diff --check
          python -m unittest tests.test_official_release_source_repository -v
          python -m unittest tests.test_official_release_source_control_api -v
          python -m unittest discover -s tests -v

name: Prepare Trend monitoring worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Verify and install Trend monitoring worker
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    concurrency:
      group: marketai-trend-monitoring-readiness
      cancel-in-progress: false

    steps:
      - name: Restrict run to deployment branch
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          if [ "$RUN_REF" != "refs/heads/feature/trading-system-foundation" ]; then
            echo "::error::Run this workflow only from feature/trading-system-foundation."
            exit 1
          fi

      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Verify and install disabled worker under deploy lock
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LOCK_FILE="/tmp/marketai-deploy-ota.lock"
          LOCK_TIMEOUT_SECONDS=300
          RUNTIME_DIR="/home/marko/marketai-repo"
          STATE_DIR="/home/marko/marketai-deploy-state"
          STATE_FILE="$STATE_DIR/last-deployed-backend.sha"
          PREPARED_STATE_FILE="$STATE_DIR/trend-monitoring-prepared.sha"
          ENV_FILE="/home/marko/marketai/.env"
          SERVICE="marketai-trend-monitoring.service"

          exec 200>"$LOCK_FILE"
          if ! flock -w "$LOCK_TIMEOUT_SECONDS" 200; then
            echo "::error::Could not acquire the MarketAI deploy/OTA lock within ${LOCK_TIMEOUT_SECONDS}s."
            exit 1
          fi

          verify_runtime_sha() {
            test -f "$STATE_FILE" || {
              echo "::error::No successfully deployed backend SHA has been recorded."
              return 1
            }
            DEPLOYED_SHA="$(tr -d '[:space:]' < "$STATE_FILE")"
            if [ "$DEPLOYED_SHA" != "$DEPLOY_SHA" ]; then
              echo "::error::Readiness commit ${DEPLOY_SHA} does not match deployed backend ${DEPLOYED_SHA}."
              return 1
            fi

            cd "$RUNTIME_DIR"
            RUNTIME_SHA="$(git rev-parse HEAD)"
            if [ "$RUNTIME_SHA" != "$DEPLOY_SHA" ]; then
              echo "::error::Production runtime checkout ${RUNTIME_SHA} does not match readiness commit ${DEPLOY_SHA}."
              return 1
            fi
            test "$(git branch --show-current)" = "feature/trading-system-foundation" || {
              echo "::error::Production runtime is not on feature/trading-system-foundation."
              return 1
            }
            test -z "$(git status --porcelain --untracked-files=no)" || {
              echo "::error::Production runtime has tracked working-tree changes."
              return 1
            }
          }

          verify_worker_quiescent() {
            LOAD_STATE="$(/usr/bin/systemctl show "$SERVICE" --property=LoadState --value 2>/dev/null || true)"
            if [ -z "$LOAD_STATE" ] || [ "$LOAD_STATE" = "not-found" ]; then
              return 0
            fi
            if [ "$LOAD_STATE" != "loaded" ]; then
              echo "::error::$SERVICE has unexpected LoadState=${LOAD_STATE}."
              return 1
            fi
            ACTIVE_STATE="$(/usr/bin/systemctl show "$SERVICE" --property=ActiveState --value)"
            SUB_STATE="$(/usr/bin/systemctl show "$SERVICE" --property=SubState --value)"
            if [ "$ACTIVE_STATE" != "inactive" ] || [ "$SUB_STATE" != "dead" ]; then
              echo "::error::$SERVICE is not inactive/dead (ActiveState=${ACTIVE_STATE}, SubState=${SUB_STATE})."
              return 1
            fi
          }

          verify_runtime_sha
          verify_worker_quiescent
          test -f "$ENV_FILE" || {
            echo "::error::Production environment file is missing: $ENV_FILE"
            exit 1
          }

          env -i HOME="$HOME" PATH="$PATH" RUNTIME_DIR="$RUNTIME_DIR" ENV_FILE="$ENV_FILE" \
            /bin/bash --noprofile --norc <<'PREFLIGHT'
          set -euo pipefail
          set -a
          # shellcheck disable=SC1090
          source "$ENV_FILE"
          set +a

          test -n "${MARKETAI_SUPABASE_URL:-}" || { echo "MARKETAI_SUPABASE_URL is required" >&2; exit 1; }
          test -n "${MARKETAI_SUPABASE_SECRET_KEY:-}" || { echo "MARKETAI_SUPABASE_SECRET_KEY is required" >&2; exit 1; }
          test -n "${ETORO_API_KEY:-}" || { echo "ETORO_API_KEY is required" >&2; exit 1; }
          test -n "${ETORO_USER_KEY:-}" || { echo "ETORO_USER_KEY is required" >&2; exit 1; }

          cd "$RUNTIME_DIR"
          "$RUNTIME_DIR/.venv/bin/python" - <<'PY'
          from trading_system.etoro_market_data import EtoroMarketDataProvider
          from trading_system.tracked_instrument_registry import SupabaseTrackedInstrumentRegistry
          from trading_system.tracking_profile_registry import SupabaseTrackedInstrumentProfileRegistry
          from trading_system.trend_monitoring_wiring import trend_refresh_interval_seconds

          trend_refresh_interval_seconds()
          EtoroMarketDataProvider.from_env()
          tracked = SupabaseTrackedInstrumentRegistry.from_env()
          profiles = SupabaseTrackedInstrumentProfileRegistry.from_env()

          # Read-only schema/credential probes. No stream is opened and no observation,
          # event, strategy, risk, broker or trade state is written.
          tracked.client.table("tracked_instruments").select("id").limit(1).execute()
          profiles.client.table("tracked_instrument_profiles").select("id").limit(1).execute()
          print("Trend monitoring readiness checks passed")
          PY
          PREFLIGHT

          verify_runtime_sha
          verify_worker_quiescent

          sudo /usr/bin/install -m 0644 \
            "$RUNTIME_DIR/deploy/systemd/marketai-trend-monitoring.service" \
            /etc/systemd/system/marketai-trend-monitoring.service
          sudo /usr/bin/systemctl daemon-reload
          sudo /usr/bin/systemctl disable "$SERVICE"

          ENABLED_STATE="$(/usr/bin/systemctl is-enabled "$SERVICE" 2>/dev/null || true)"
          if [ "$ENABLED_STATE" != "disabled" ]; then
            echo "::error::$SERVICE is not disabled (state: ${ENABLED_STATE:-unknown})."
            exit 1
          fi
          verify_worker_quiescent
          verify_runtime_sha

          mkdir -p "$STATE_DIR"
          PREPARED_TMP="${PREPARED_STATE_FILE}.tmp.$$"
          printf '%s\n' "$DEPLOY_SHA" > "$PREPARED_TMP"
          chmod 0644 "$PREPARED_TMP"
          mv -f "$PREPARED_TMP" "$PREPARED_STATE_FILE"

          echo "$SERVICE installed, disabled and quiescent at prepared SHA ${DEPLOY_SHA}"

name: Temporary PR179 linked details cleanup

on:
  push:
    branches:
      - fix/home-event-unification
    paths:
      - .github/workflows/tmp-pr179-linked-details.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Remove temporary validation files
        run: |
          set -euo pipefail
          WORK=/tmp/marketai-pr179-linked-details-cleanup
          rm -rf "$WORK"
          git clone --branch fix/home-event-unification --single-branch https://github.com/Calvonen/market-memory-bot.git "$WORK"
          cd "$WORK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-pr179-linked-details.yml scripts/tmp_fix_pr179_linked_details.py
          git commit -m "chore: remove temporary PR179 linked-details validation"
          git push origin HEAD:fix/home-event-unification

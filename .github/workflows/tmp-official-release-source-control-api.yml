name: Temporary official release source control API validation

on:
  push:
    branches:
      - feature/official-release-source-control-api

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/official-release-source-control-api
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source patch
        run: python .github/scripts/apply_official_release_source_control_api.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and diff check
        run: |
          python -m py_compile trading_system/api.py trading_system/official_release_source_repository.py tests/test_official_release_source_control_api.py
          git diff --check
      - name: Focused tests
        run: python -m unittest discover -s tests -p 'test_official_release_source*.py' -v
      - name: Full canonical suite
        run: |
          set +e
          python -m unittest discover -s tests -v > full-suite-failure.txt 2>&1
          rc=$?
          cat full-suite-failure.txt
          exit $rc
      - name: Persist failure log
        if: failure()
        run: |
          if [ -f full-suite-failure.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f full-suite-failure.txt
            git commit -m "chore: capture full-suite failure [skip ci]"
            git push origin HEAD:feature/official-release-source-control-api
          fi
      - name: Commit validated implementation
        if: success()
        run: |
          rm -f full-suite-failure.txt
          rm .github/workflows/tmp-official-release-source-control-api.yml
          rm .github/scripts/apply_official_release_source_control_api.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A trading_system/api.py trading_system/official_release_source_repository.py tests/test_official_release_source_control_api.py .github/workflows/tmp-official-release-source-control-api.yml .github/scripts/apply_official_release_source_control_api.py full-suite-failure.txt
          git commit -m "feat: add official release source control API"
          git push origin HEAD:feature/official-release-source-control-api

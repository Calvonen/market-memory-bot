name: Temporary official release source control API validation

on:
  push:
    branches:
      - feature/official-release-source-control-api

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/official-release-source-control-api
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source patch
        run: python .github/scripts/apply_official_release_source_control_api.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate
        run: |
          python -m py_compile trading_system/api.py trading_system/official_release_source_repository.py tests/test_official_release_source_control_api.py
          git diff --check
          python -m unittest tests.test_official_release_source_repository tests.test_official_release_source_control_api -v
          python -m unittest discover -s tests -v
      - name: Commit validated implementation
        run: |
          rm .github/workflows/tmp-official-release-source-control-api.yml
          rm .github/scripts/apply_official_release_source_control_api.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trading_system/api.py trading_system/official_release_source_repository.py tests/test_official_release_source_control_api.py .github/workflows/tmp-official-release-source-control-api.yml .github/scripts/apply_official_release_source_control_api.py
          git commit -m "feat: add official release source control API"
          git push origin HEAD:feature/official-release-source-control-api

name: Temporary home event unification fix

on:
  push:
    branches:
      - fix/home-event-unification
    paths:
      - .github/workflows/tmp-home-event-unification.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Patch and validate
        run: |
          set -euo pipefail
          WORK=/tmp/marketai-home-event-unification
          rm -rf "$WORK"
          git clone --branch fix/home-event-unification --single-branch https://github.com/Calvonen/market-memory-bot.git "$WORK"
          cd "$WORK"
          python3 scripts/tmp_patch_home_event_unification.py
          cd mobile
          npm ci
          npx tsc --noEmit
          npm run lint
          cd ..
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "mobile/src/app/(tabs)/index.tsx" mobile/src/components/TrackedEventsSection.tsx
          git commit -m "fix: unify Home event cards"
          git push origin HEAD:fix/home-event-unification

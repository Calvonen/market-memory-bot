name: Temporary PR179 P2 assertion fix

on:
  push:
    branches:
      - fix/home-event-unification
    paths:
      - .github/workflows/tmp-pr179-p2-assertion.yml
      - scripts/tmp_fix_pr179_p2_assertion.py

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Patch and validate
        run: |
          set -euo pipefail
          WORK=/tmp/marketai-pr179-p2-assertion
          PY=/home/marko/marketai-repo/.venv/bin/python
          rm -rf "$WORK"
          git clone --branch fix/home-event-unification --single-branch https://github.com/Calvonen/market-memory-bot.git "$WORK"
          cd "$WORK"
          python3 scripts/tmp_fix_pr179_p2_assertion.py
          "$PY" -m unittest tests.test_mobile_source -v
          cd mobile
          npm ci
          npx tsc --noEmit
          npm run lint
          cd ..
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_mobile_source.py
          git commit -m "test: bind Home loading fallback assertion"
          git push origin HEAD:fix/home-event-unification

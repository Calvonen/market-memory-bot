name: Temporary Autodesk end-to-end setup

on:
  push:
    branches:
      - ops/runtime-deploy-diagnostic
    paths:
      - .github/workflows/tmp-runtime-deploy-diagnostic.yml

permissions:
  contents: read

jobs:
  setup:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Track Autodesk and approve official results page via production API
        shell: bash
        run: |
          set -euo pipefail
          cd /home/marko/marketai-repo
          test "$(git branch --show-current)" = "feature/trading-system-foundation"
          test "$(git rev-parse HEAD)" = "493f040ab7ace26d72c748cf5ee19960dbfab0fe"
          test -z "$(git status --porcelain --untracked-files=no)"

          set -a
          source /home/marko/marketai/.env
          set +a

          API=http://127.0.0.1:8001
          CALENDAR_ID=24b20d87-f7cf-408f-80e4-b7a94624229f
          EVENT_ID="calendar:${CALENDAR_ID}"

          echo "Tracking Autodesk calendar event ${CALENDAR_ID}"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "X-MarketAI-Control-Key: ${MARKETAI_CONTROL_API_KEY}" \
            "${API}/api/v1/calendar/${CALENDAR_ID}/track" \
            | tee /tmp/marketai-adsk-track.json
          echo

          echo "Reading current official-source generation"
          curl --fail-with-body --silent --show-error \
            -H "X-MarketAI-Key: ${MARKETAI_READ_API_KEY}" \
            "${API}/api/v1/events/${EVENT_ID}/official-release-source" \
            > /tmp/marketai-adsk-source-before.json
          cat /tmp/marketai-adsk-source-before.json
          echo

          EXPECTED_VERSION="$(python - <<'PY'
          import json
          with open('/tmp/marketai-adsk-source-before.json', encoding='utf-8') as fh:
              print(int(json.load(fh)['version']))
          PY
          )"

          echo "Approving Autodesk official event/results page at expected_version=${EXPECTED_VERSION}"
          python - <<'PY' >/tmp/marketai-adsk-source-body.json
          import json
          with open('/tmp/marketai-adsk-source-before.json', encoding='utf-8') as fh:
              expected = int(json.load(fh)['version'])
          print(json.dumps({
              'source_kind': 'results_page',
              'source_url': 'https://investors.autodesk.com/events/event-details/q2-fy27-autodesk-earnings-conference-call',
              'source_title': 'Q2 FY27 Autodesk Earnings Conference Call',
              'expected_version': expected,
          }))
          PY

          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Content-Type: application/json" \
            -H "X-Admin-Token: ${MARKETAI_ADMIN_API_KEY}" \
            -H "X-MarketAI-Actor: e2e-test-setup" \
            --data-binary @/tmp/marketai-adsk-source-body.json \
            "${API}/api/v1/events/${EVENT_ID}/official-release-source" \
            | tee /tmp/marketai-adsk-source-after.json
          echo

          echo "Running release discovery once after setup"
          sudo /usr/bin/systemctl start marketai-calendar-release.service
          /usr/bin/systemctl show marketai-calendar-release.service \
            --property=Result,ExecMainStatus,ActiveState,SubState --no-pager
          sudo /usr/bin/journalctl -u marketai-calendar-release.service -n 30 --no-pager

          echo "API health"
          curl --fail --silent "${API}/health"
          echo

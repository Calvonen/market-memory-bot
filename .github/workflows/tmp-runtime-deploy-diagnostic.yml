name: Temporary runtime deploy branch repair

on:
  push:
    branches:
      - ops/runtime-deploy-diagnostic
    paths:
      - .github/workflows/tmp-runtime-deploy-diagnostic.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Return clean deployment repository to canonical branch
        run: |
          set -euo pipefail
          cd /home/marko/marketai-repo
          test -z "$(git status --porcelain --untracked-files=no)"
          git fetch origin feature/trading-system-foundation
          if git show-ref --verify --quiet refs/heads/feature/trading-system-foundation; then
            git switch feature/trading-system-foundation
          else
            git switch --track -c feature/trading-system-foundation origin/feature/trading-system-foundation
          fi
          git merge --ff-only origin/feature/trading-system-foundation
          test "$(git branch --show-current)" = "feature/trading-system-foundation"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "DEPLOY_REPO_HEAD=$(git rev-parse HEAD)"

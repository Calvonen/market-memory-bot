name: Temporary Autodesk source adjustment

on:
  push:
    branches:
      - ops/runtime-deploy-diagnostic
    paths:
      - .github/workflows/tmp-runtime-deploy-diagnostic.yml

permissions:
  contents: read

jobs:
  adjust:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Switch Autodesk to dated press-release listing and run discovery
        shell: bash
        run: |
          set -euo pipefail
          cd /home/marko/marketai-repo
          test "$(git branch --show-current)" = "feature/trading-system-foundation"
          test "$(git rev-parse HEAD)" = "493f040ab7ace26d72c748cf5ee19960dbfab0fe"
          test -z "$(git status --porcelain --untracked-files=no)"

          set -a
          source /home/marko/marketai/.env
          set +a

          API=http://127.0.0.1:8001
          EVENT_ID="calendar:24b20d87-f7cf-408f-80e4-b7a94624229f"
          PY=/home/marko/marketai-repo/.venv/bin/python

          curl --fail-with-body --silent --show-error \
            -H "X-MarketAI-Key: ${MARKETAI_READ_API_KEY}" \
            "${API}/api/v1/events/${EVENT_ID}/official-release-source" \
            > /tmp/marketai-adsk-source-before.json
          cat /tmp/marketai-adsk-source-before.json
          echo

          ${PY} - <<'PY' >/tmp/marketai-adsk-source-body.json
          import json
          with open('/tmp/marketai-adsk-source-before.json', encoding='utf-8') as fh:
              expected = int(json.load(fh)['version'])
          print(json.dumps({
              'source_kind': 'results_page',
              'source_url': 'https://investors.autodesk.com/news-events/press-releases?page=23',
              'source_title': 'Autodesk Press Releases',
              'expected_version': expected,
          }))
          PY

          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Content-Type: application/json" \
            -H "X-Admin-Token: ${MARKETAI_ADMIN_API_KEY}" \
            -H "X-MarketAI-Actor: e2e-test-source-adjustment" \
            --data-binary @/tmp/marketai-adsk-source-body.json \
            "${API}/api/v1/events/${EVENT_ID}/official-release-source" \
            | tee /tmp/marketai-adsk-source-after.json
          echo

          sudo /usr/bin/systemctl start marketai-calendar-release.service
          /usr/bin/systemctl show marketai-calendar-release.service \
            --property=Result,ExecMainStatus,ActiveState,SubState --no-pager
          curl --fail --silent "${API}/health"
          echo
